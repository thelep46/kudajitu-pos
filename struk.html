<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Invoice <?= invoiceId ?> - KUDAJITU</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #f8f9fa; font-family: 'Courier New', Courier, monospace; padding: 20px; color: #333; }
    .receipt-card { background: #fff; max-width: 450px; margin: 0 auto; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); border-top: 5px solid #ff5722; }
    .divider { border-bottom: 2px dashed #ddd; margin: 20px 0; }
    .person-box { background: #fdfdfd; border: 1px solid #eee; padding: 12px; border-radius: 8px; margin-bottom: 15px; }
    .person-name { font-weight: bold; color: #ff5722; margin-bottom: 8px; font-size: 15px; border-bottom: 1px solid #eee; padding-bottom: 4px; }
    table { width: 100%; font-size: 14px; }
    td { padding: 4px 0; }
    .right { text-align: right; }
    .brand-title { font-weight: 900; letter-spacing: 1px; color: #212529; font-family: sans-serif; }
    @media print { 
      body { background: #fff; padding: 0; } 
      .receipt-card { box-shadow: none; border: none; padding: 10px; } 
      .no-print { display: none; } 
    }
  </style>
</head>
<body>

  <div class="receipt-card">
    <div class="text-center mb-3">
      <h3 class="brand-title">KUDAJITU COFFEE</h3>
      <p class="text-muted small mb-1">Digital Receipt & Billing</p>
      <span class="badge bg-dark">ID: <?= invoiceId ?></span>
    </div>

    <div class="divider"></div>
    <div id="receipt-content">
      <p class="text-center text-muted">Memuat data tagihan...</p>
    </div>

    <div class="divider"></div>
    
    <div class="text-center my-3">
      <p class="small text-muted mb-1">Scan untuk Pembayaran / Info</p>
      <img src="https://i.postimg.cc/Gh3qPdhm/image-(1).png" alt="QRIS" class="img-thumbnail" style="width: 200px; height: 200px;">
    </div>

    <div class="no-print d-grid gap-2 mt-4">
      <button class="btn btn-dark" onclick="window.print()">🖨️ Cetak / Simpan PDF</button>
    </div>
  </div>

  <script>
    const invId = "<?= invoiceId ?>";
    google.script.run.withSuccessHandler(renderReceipt).getInvoiceData(invId);

    function renderReceipt(data) {
      if(!data || data.length === 0) {
        document.getElementById('receipt-content').innerHTML = '<p class="text-center text-danger">Invoice tidak ditemukan.</p>';
        return;
      }

      let html = `<div class="small text-muted mb-3 text-center">Waktu Transaksi: ${data[0].waktu}</div>`;
      let grandTotal = 0;

      let grouped = {};
      data.forEach(item => {
        if(!grouped[item.nama]) grouped[item.nama] = [];
        grouped[item.nama].push(item);
      });

      for(let person in grouped) {
        let personSubtotal = 0;
        html += `<div class="person-box">
                  <div class="person-name">👤 ${person}</div>
                  <table>`;
        
        grouped[person].forEach(row => {
          html += `<tr>
                    <td>${row.pesanan}</td>
                    <td class="right">KHR ៛ ${row.total.toLocaleString('id-ID')}</td>
                  </tr>`;
          personSubtotal += row.total;
        });

        html += `</table>
                 <div class="text-end fw-bold mt-2 pt-1 border-top small" style="color: #555;">
                   Subtotal ${person}: KHR ៛ ${personSubtotal.toLocaleString('id-ID')}
                 </div>
               </div>`;
        grandTotal += personSubtotal;
      }

      html += `<div class="d-flex justify-content-between align-items-center mt-3 pt-2 border-top">
                 <h5 class="fw-bold mb-0">TOTAL TAGIHAN</h5>
                 <h4 class="fw-bold text-danger mb-0">KHR ៛ ${grandTotal.toLocaleString('id-ID')}</h4>
               </div>`;

      document.getElementById('receipt-content').innerHTML = html;
    }
  </script>
</body>
</html>
