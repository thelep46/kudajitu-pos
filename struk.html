<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Invoice - KUDAJITU COFFEE</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"><style>body{background:#f8f9fa;font-family:'Courier New',Courier,monospace;padding:20px;color:#333}.receipt-card{background:#fff;max-width:450px;margin:0 auto;padding:30px;border-radius:12px;box-shadow:0 4px 15px rgba(0,0,0,.08);border-top:5px solid #ff5722}.divider{border-bottom:2px dashed #ddd;margin:20px 0}.person-box{background:#fdfdfd;border:1px solid #eee;padding:12px;border-radius:8px;margin-bottom:15px}.person-name{font-weight:bold;color:#ff5722;margin-bottom:8px;font-size:15px;border-bottom:1px solid #eee;padding-bottom:4px}table{width:100%;font-size:14px}td{padding:4px 0}.right{text-align:right}.brand-title{font-weight:900;letter-spacing:1px;color:#212529;font-family:sans-serif}.status{display:inline-block;padding:5px 10px;border-radius:20px;font-family:sans-serif;font-size:12px;font-weight:700}.paid{background:#d1e7dd;color:#0f5132}.unpaid{background:#f8d7da;color:#842029}.error{color:#b02a37;text-align:center}@media print{body{background:#fff;padding:0}.receipt-card{box-shadow:none;border:none;padding:10px}.no-print{display:none}}</style></head><body><div class="receipt-card"><div class="text-center mb-3"><h3 class="brand-title">KUDAJITU COFFEE</h3><p class="text-muted small mb-1">Digital Receipt &amp; Billing</p><span id="invoice-id" class="badge bg-dark">Memuat...</span></div><div class="divider"></div><div id="receipt-content"><p class="text-center text-muted">Memuat data tagihan...</p></div><div class="divider"></div><div class="text-center my-3"><p class="small text-muted mb-1">Scan untuk Pembayaran / Info</p><img src="https://i.postimg.cc/Gh3qPdhm/image-(1).png" alt="QRIS" class="img-thumbnail" style="width:200px;height:200px"></div><div class="no-print d-grid gap-2 mt-4"><button class="btn btn-dark" onclick="window.print()">🖨️ Cetak / Simpan PDF</button></div></div><script>'use strict';const API_URL='https://script.google.com/macros/s/AKfycbzztA7uR8e0unmEVYE_sL1m3p-HWveusfhV_pjJHDhGWvqGIAhfZB_2IeAHv8MHa_5b/exec';const params=new URLSearchParams(window.location.search);const invId=params.get('id')||'';document.getElementById('invoice-id').textContent=invId||'Invoice';function escapeHtml(value){return String(value==null?'':value).replace(/[&<>"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'})[c]})}function formatMoney(v){return Number(v||0).toLocaleString('id-ID')}async function loadInvoice(){const target=document.getElementById('receipt-content');if(!invId){target.innerHTML='<p class="error">Invoice ID tidak ditemukan.</p>';return}try{const url=new URL(API_URL);url.searchParams.set('action','getInvoice');url.searchParams.set('id',invId);const response=await fetch(url.toString(),{method:'GET',mode:'cors',cache:'no-store'});if(!response.ok)throw new Error('HTTP '+response.status);const result=await response.json();if(!result.ok)throw new Error(result.error||'API error');renderReceipt(result.data||[])}catch(err){console.error(err);target.innerHTML='<p class="error">Gagal memuat invoice.</p><p class="text-center small text-muted">'+escapeHtml(err.message)+'</p>'}}function renderReceipt(data){const target=document.getElementById('receipt-content');if(!Array.isArray(data)||!data.length){target.innerHTML='<p class="error">Invoice tidak ditemukan.</p>';return}let html='<div class="small text-muted mb-3 text-center">Waktu Transaksi: '+escapeHtml(data[0].waktu)+'</div>';let grouped={};let grandTotal=0;data.forEach(function(item){if(!grouped[item.nama])grouped[item.nama]=[];grouped[item.nama].push(item)});Object.keys(grouped).forEach(function(person){let subtotal=0;html+='<div class="person-box"><div class="person-name">👤 '+escapeHtml(person)+'</div><table>';grouped[person].forEach(function(row){const total=Number(row.total)||0;subtotal+=total;html+='<tr><td>'+escapeHtml(row.pesanan)+'</td><td class="right">KHR ៛ '+formatMoney(total)+'</td></tr>'});html+='</table><div class="text-end fw-bold mt-2 pt-1 border-top small" style="color:#555">Subtotal '+escapeHtml(person)+': KHR ៛ '+formatMoney(subtotal)+'</div></div>';grandTotal+=subtotal});const status=data.every(function(row){return row.status==='Sudah Bayar'});html+='<div class="d-flex justify-content-between align-items-center mt-3 pt-2 border-top"><h5 class="fw-bold mb-0">TOTAL TAGIHAN</h5><h4 class="fw-bold text-danger mb-0">KHR ៛ '+formatMoney(grandTotal)+'</h4></div><div class="text-center mt-3"><span class="status '+(status?'paid':'unpaid')+'">'+(status?'✓ SUDAH BAYAR':'⚠ BELUM BAYAR')+'</span></div>';target.innerHTML=html}loadInvoice();</script></body></html>
