<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Struk Pesanan - KUDAJITU AMAZON</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"><style>.action-area{width:100%;max-width:420px;display:flex;gap:10px;margin-top:16px}.action-area .btn{flex:1}@media print{.action-area{display:none!important}body{background:#fff!important}.receipt-card{box-shadow:none!important}}</style></head><body><div class="receipt-container"><div class="receipt-card"><div class="receipt-header"><h1>KUDAJITU AMAZON</h1><p>E-Receipt / Bukti Tagihan Digital</p></div><div id="receipt-content" class="empty-state"><i class="fas fa-circle-notch fa-spin"></i><p>Memuat invoice...</p></div></div><div class="action-area"><button class="btn btn-outline" onclick="history.back()">Kembali</button><button class="btn btn-primary" onclick="window.print()">Simpan / Cetak PDF</button></div></div><script>const API_URL='PASTE_GOOGLE_APPS_SCRIPT_WEB_APP_URL_HERE';function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}function money(v){return Number(v||0).toLocaleString('en-US');}async function load(){const id=new URLSearchParams(location.search).get('id'),box=document.getElementById('receipt-content');if(!id)return box.innerHTML='<div class="error-state">Invoice tidak ditemukan.</div>';try{const u=new URL(API_URL);u.searchParams.set('action','getInvoice');u.searchParams.set('id',id);const r=await fetch(u);const j=await r.json();if(!j.ok)throw new Error(j.error);if(!j.data.length)throw new Error('Invoice tidak ditemukan.');let total=0;const items=j.data.map(x=>{total+=Number(x.total)||0;return '<div class="item-row"><span>'+esc(x.pesanan)+'</span><strong>KHR '+money(x.total)+'</strong></div>';}).join('');box.outerHTML='<div class="receipt-body"><div class="receipt-info"><div>Tanggal<strong>'+esc(j.data[0].waktu)+'</strong></div><div class="text-right">No. Pesanan<strong>#'+esc(id)+'</strong></div></div><div class="receipt-info"><div>Pelanggan / Meja<strong class="customer-name">'+esc(j.data[0].nama)+'</strong></div><div class="text-right">Status<div class="badge '+(j.data[0].status==='Sudah Bayar'?'badge-paid':'badge-unpaid')+'">'+esc(j.data[0].status)+'</div></div></div><div class="items-container">'+items+'</div><div class="receipt-total"><span>TOTAL BAYAR</span><strong>KHR '+money(total)+'</strong></div></div>';}catch(e){box.innerHTML='<div class="error-state"><i class="fas fa-triangle-exclamation"></i><p>'+esc(e.message)+'</p></div>';}}load();</script></body></html>
